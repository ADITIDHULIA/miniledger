services:
  db:
    image: postgres:16-alpine
    container_name: miniledger-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: miniledger
      POSTGRES_PASSWORD: miniledger # local development only
      POSTGRES_DB: miniledger
    ports:
      - "5432:5432"
    volumes:
      - miniledger-data:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro

volumes:
  miniledger-data:
